anrope,sans-serif;font-size:25px;line-height:1.25}.pd-info p{color:var(--muted);font-size:13px;line-height:1.7}.specs{width:100%;border-collapse:collapse;margin-top:18px}.specs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.specs td:first-child{color:var(--muted);width:42%}.hgrid{display:flex;gap:12px;overflow:auto}.hgrid .card{min-width:190px}.toast{position:fixed;z-index:300;bottom:25px;left:50%;transform:translateX(-50%);display:none;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:700}.toast.show{display:block}.loading{text-align:center;padding:80px;color:var(--muted)}

<footer><div class="wrap footer-grid"><div><img class="footer-logo" src="DivyKart_combinational_logo.png" alt="DivyKart.in"><p>India's deal-discovery hub — compare products across popular shopping platforms.</p></div><div><h4>Shop</h4><a onclick="goHome()">All Categories</a><a onclick="showDeals()">Today's Deals</a><a onclick="showWishlist()">Wishlist</a><a href="app/index.html">Download App </a></div><div><h4>Company</h4><a href="about us/index.html">About Us</a><a href="https://deepakprajapati.vercel.app/#contact">Contact Us</a><a href="https://wa.me/916232392726">Careers</a><a href="https://deepakprajapati.vercel.app/">About Owner</a></div><div><h4>Legal</h4><a href="privacy policy/index.html">Privacy Policy</a><a>Terms of Use</a><a href="disclosure/index.html">Affiliate Disclosure</a></div></div></footer>

<script>
const PLATFORM_COLORS={Flipkart:"#2874F0",Meesho:"#A0169A",Amazon:"#FF9900",Myntra:"#FF3F6C",Ajio:"#2B2B2B",Nykaa:"#FC2779","Tata CliQ":"#E31E24"};
const CATEGORIES=["All","Electronics","Mobiles","Fashion","Beauty","Grocery","Kitchen","Home Decor","Furniture","Appliances","Books","Sports","Toys","Automotive"];
const FASHION_SUBCATEGORIES=["All","Men","Women","Kids"];
const PRICE_PRESETS=[{label:"Under ₹500",min:0,max:500},{label:"₹500 – ₹1,000",min:500,max:1000},{label:"₹1,000 – ₹2,000",min:1000,max:2000},{label:"₹2,000+",min:2000,max:null}];
let products=[], banners=[], filterCategory="All", filterSubCategory="All", wishlist=new Set(), query="", sort="popularity", slide=0;
let priceMin=null, priceMax=null;

async function loadProducts(){document.getElementById("content").innerHTML='<div class="loading">Loading the latest deals…</div>';const r=await fetch("/api/products?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Failed to load products");products=await r.json();render()}

async function loadBanners(){
  try{
    const r=await fetch("/api/banners?ts="+Date.now(),{cache:"no-store"});
    banners=r.ok?await r.json():[];
  }catch(e){banners=[]}
  renderBanners();
}
function runBannerAction(action){
  if(!action||action==="scroll"){document.getElementById("content").scrollIntoView({behavior:"smooth"});return}
  if(action==="deals"){showDeals();return}
  if(action.startsWith("category:")){filterCategory=action.split(":")[1];filterSubCategory="All";render();return}
  if(/^https?:\/\//i.test(action)){window.open(action,"_blank","noopener");return}
}
function renderBanners(){
  const hero=document.getElementById("hero");
  if(!banners.length){hero.style.display="none";return}
  hero.style.display="";
  hero.innerHTML=banners.map((b,i)=>`
    <div class="slide${i===0?" active":""}" style="background:linear-gradient(115deg,${esc(b.gradientFrom||"#2563eb")} 0%,${esc(b.gradientTo||"#4f8dfb")} 100%)">
      <small>${esc(b.tag||"")}</small>
      <h1>${esc(b.title)}</h1>
      <p>${esc(b.subtitle||"")}</p>
      <div class="hero-cta">
        ${b.buttonText?`<button class="hero-btn" onclick='runBannerAction(${JSON.stringify(b.buttonAction||"scroll")})'>${esc(b.buttonText)}</button>`:""}
        ${b.secondaryText?`<button class="hero-btn alt" onclick='runBannerAction(${JSON.stringify(b.secondaryAction||"scroll")})'>${esc(b.secondaryText)}</button>`:""}
      </div>
    </div>`).join("");
  slide=0;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return Number(n||0).toLocaleString("en-IN")}
function priceAge(ts){if(!ts)return"";const d=Math.floor((Date.now()-ts)/86400000);if(d<=0)return"Price checked today";if(d===1)return"Price checked 1 day ago";if(d<30)return`Price checked ${d} days ago`;const mo=Math.floor(d/30);return`Price checked ${mo} month${mo>1?"s":""} ago`}
function renderCategories(){document.getElementById("categories").innerHTML=CATEGORIES.map(c=>`<button class="cat-chip ${filterCategory===c?"active":""}" onclick="filterCategory='${c}';filterSubCategory='All';render()">${c}</button>`).join("")}
function card(p){return `<article class="card" onclick="openProduct('${esc(p.id)}')"><div class="card-img"><img src="${esc(p.images?.[0]||"https://picsum.photos/500")}" loading="lazy"><button class="wish" onclick="event.stopPropagation();toggleWish('${esc(p.id)}')">${wishlist.has(p.id)?"♥":"♡"}</button>${p.offerTag?`<span class="pill">${esc(p.offerTag)}</span>`:`<span class="pill" style="background:${PLATFORM_COLORS[p.platform]||"#2563EB"}">${esc(p.platform)}</span>`}</div><div class="card-body"><div class="brand">${esc(p.brand)}</div><div class="title">${esc(p.name)}</div><div class="rating"><span class="stars">★★★★★</span> ${p.rating} · ${money(p.reviewCount)} ratings</div><div><span class="price">₹${money(p.discountPrice)}</span> <span class="old">₹${money(p.price)}</span></div><div class="price-note">⏱ ${esc(priceAge(p.priceUpdatedAt))}</div><div class="delivery">✓ ${esc(p.deliveryBadge)}</div></div></article>`}
function getFiltered(){
  let a=products.filter(p=>
    (filterCategory==="All"||p.category===filterCategory)&&
    (filterCategory!=="Fashion"||filterSubCategory==="All"||p.subCategory===filterSubCategory)&&
    (priceMin==null||p.discountPrice>=priceMin)&&
    (priceMax==null||p.discountPrice<=priceMax)&&
    (!query||[p.name,p.brand,p.category,p.platform].join(" ").toLowerCase().includes(query.toLowerCase()))
  );
  if(sort==="priceLow")a.sort((x,y)=>x.discountPrice-y.discountPrice);
  if(sort==="priceHigh")a.sort((x,y)=>y.discountPrice-x.discountPrice);
  if(sort==="rating")a.sort((x,y)=>y.rating-x.rating);
  if(sort==="discount")a.sort((x,y)=>y.discountPercent-x.discountPercent);
  return a;
}
function priceFilterLabel(){
  if(priceMin==null&&priceMax==null)return"Price";
  if(priceMin!=null&&priceMax!=null)return`₹${money(priceMin)}–₹${money(priceMax)}`;
  if(priceMin!=null)return`Above ₹${money(priceMin)}`;
  return`Under ₹${money(priceMax)}`;
}
function togglePricePanel(){document.getElementById("pricePanel")?.classList.toggle("open")}
function applyPresetPrice(min,max){priceMin=min;priceMax=max;document.getElementById("priceMinInput").value=min??"";document.getElementById("priceMaxInput").value=max??"";render()}
function applyCustomPrice(){
  const minVal=document.getElementById("priceMinInput").value;
  const maxVal=document.getElementById("priceMaxInput").value;
  priceMin=minVal===""?null:Number(minVal);
  priceMax=maxVal===""?null:Number(maxVal);
  render();
}
function clearPriceFilter(){priceMin=null;priceMax=null;render()}
function setSubCategory(sc){filterSubCategory=sc;render()}
function render(){
  renderCategories();
  query=document.getElementById("search")?.value||query;
  const hasPriceFilter=priceMin!=null||priceMax!=null;
  const subcatStrip=filterCategory==="Fashion"?`<div class="subcat-strip">${FASHION_SUBCATEGORIES.map(sc=>`<button class="subcat-chip ${filterSubCategory===sc?"active":""}" onclick="setSubCategory('${sc}')">${sc==="All"?"All Fashion":sc}</button>`).join("")}</div>`:"";
  let list=getFiltered();
  document.getElementById("content").innerHTML=`
    <div class="section-head">
      <div><h2>Discover the Best Deals</h2><p>${list.length} products available</p></div>
      <div class="filters">
        <div class="price-filter">
          <button class="select price-filter-toggle" onclick="togglePricePanel()">💰 ${priceFilterLabel()} ${hasPriceFilter?'<span class="badge">✓</span>':""}</button>
          <div class="price-panel" id="pricePanel">
            <h4>Filter by Price</h4>
            <div class="price-presets">${PRICE_PRESETS.map(pr=>`<button class="price-chip ${priceMin===pr.min&&priceMax===pr.max?"active":""}" onclick="applyPresetPrice(${pr.min},${pr.max})">${pr.label}</button>`).join("")}</div>
            <div class="price-inputs">
              <input type="number" min="0" id="priceMinInput" placeholder="Min ₹" value="${priceMin??""}">
              <span>–</span>
              <input type="number" min="0" id="priceMaxInput" placeholder="Max ₹" value="${priceMax??""}">
            </div>
            <div class="price-actions">
              <button class="btn ghost" onclick="clearPriceFilter()">Clear</button>
              <button class="btn" onclick="applyCustomPrice()">Apply</button>
            </div>
          </div>
        </div>
        <select class="select" onchange="sort=this.value;render()">
          <option value="popularity" ${sort==="popularity"?"selected":""}>Popularity</option>
          <option value="priceLow" ${sort==="priceLow"?"selected":""}>Price: Low to High</option>
          <option value="priceHigh" ${sort==="priceHigh"?"selected":""}>Price: High to Low</option>
          <option value="rating" ${sort==="rating"?"selected":""}>Top Rated</option>
          <option value="discount" ${sort==="discount"?"selected":""}>Biggest Discount</option>
        </select>
      </div>
    </div>
    ${subcatStrip}
    ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><h2>No products found</h2><p>Try another search, category or price range.</p></div>`}`;
  document.getElementById("wishCount").textContent=wishlist.size||"";
}
function toggleWish(id){wishlist.has(id)?wishlist.delete(id):wishlist.add(id);render()}

function productShareData(p){
  const url=`${location.origin}${location.pathname}?product=${encodeURIComponent(p.id)}`;
  const text=`${p.name} — ₹${money(p.discountPrice)} (was ₹${money(p.price)}) on DivyKart.in`;
  return{title:p.name,text,url};
}

async function shareProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const data=productShareData(p);
  if(navigator.share){
    try{await navigator.share(data);}catch(e){/* user cancelled share sheet — no error toast needed */}
    return;
  }
  try{
    await navigator.clipboard.writeText(`${data.text}\n${data.url}`);
    showToast("Link copied to clipboard!");
  }catch(e){
    showToast("Could not copy link");
  }
}

function showToast(msg){
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove("show"),2200);
}
function goHome(){filterCategory="All";filterSubCategory="All";priceMin=null;priceMax=null;query="";document.getElementById("search").value="";render()}
function showDeals(){filterCategory="All";filterSubCategory="All";sort="discount";query="";document.getElementById("search").value="";render()}
function showWishlist(){let items=products.filter(p=>wishlist.has(p.id));document.getElementById("content").innerHTML=`<div class="section-head"><div><h2>Your Wishlist</h2><p>${items.length} saved item(s)</p></div></div>${items.length?`<div class="grid">${items.map(card).join("")}</div>`:`<div class="empty"><h2>Your wishlist is empty</h2><button class="btn" onclick="goHome()">Browse Products</button></div>`}`}
let currentReviewProductId=null, reviewDraftRating=0, modalHistoryPushed=false;

function openProduct(id){
  let p=products.find(x=>x.id===id);if(!p)return;
  currentReviewProductId=id;
  reviewDraftRating=0;
  let imgs=(p.images&&p.images.length?p.images:["https://picsum.photos/500"]);
  document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeProduct()"><div class="modal"><button class="close" onclick="closeProduct()">×</button><div class="pd"><div class="pd-gallery"><div class="pd-gallery-viewport" id="galleryViewport"><div class="pd-gallery-track" id="galleryTrack">${imgs.map(im=>`<img src="${esc(im)}" draggable="false">`).join("")}</div>${imgs.length>1?`<button class="gallery-arrow prev" onclick="galleryPrev()">‹</button><button class="gallery-arrow next" onclick="galleryNext()">›</button><div class="gallery-dots">${imgs.map((_,i)=>`<button class="dot${i===0?" active":""}" onclick="setGallerySlide(${i})"></button>`).join("")}</div>`:""}</div>${imgs.length>1?`<div class="thumbs">${imgs.map((im,i)=>`<img src="${esc(im)}" class="${i===0?"active":""}" onclick="setGallerySlide(${i})">`).join("")}</div>`:""}</div><div class="pd-info"><small style="color:${PLATFORM_COLORS[p.platform]||"#2563EB"}">${esc(p.platform)}</small><h2>${esc(p.name)}</h2><div class="rating"><span class="stars">★★★★★</span> ${p.rating} · ${money(p.reviewCount)} ratings</div><h2>₹${money(p.discountPrice)} <span class="old">₹${money(p.price)}</span></h2><div class="price-alert"><span class="icon">⚠️</span><div><b>Price may vary</b><span>${esc(priceAge(p.priceUpdatedAt))} · Prices on ${esc(p.platform)} change often — please confirm the final price there before purchase.</span></div></div><p>${esc(p.description)}</p><p style="color:var(--success);font-weight:700">✓ ${esc(p.deliveryBadge)}</p><table class="specs">${(p.specs||[]).map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join("")}</table><button class="btn" style="width:100%;margin-top:15px" onclick="window.open('${esc(p.affiliateUrl)}','_blank','noopener')">Buy Now on ${esc(p.platform)} ↗</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="toggleWish('${esc(p.id)}');closeProduct()">♡ ${wishlist.has(p.id)?"Saved to Wishlist":"Add to Wishlist"}</button>

<div id="reviewsSection">
  <h3 style="margin-top:26px">Ratings &amp; Reviews</h3>
  <div class="rating-summary">
    <div>
      <div class="rating-big" id="rsAvg">${p.rating}</div>
      <div class="rating-stars-lg">${starString(p.rating)}</div>
    </div>
    <div class="rating-count" id="rsCount">${money(p.reviewCount)} rating${p.reviewCount===1?"":"s"}</div>
  </div>
  <div id="reviewsList"><div class="no-reviews">Loading reviews…</div></div>

  <div class="review-form">
    <h4>Write a Review</h4>
    <div class="star-picker" id="starPicker">${[1,2,3,4,5].map(n=>`<span data-star="${n}" onclick="setDraftRating(${n})">★</span>`).join("")}</div>
    <input id="rvName" placeholder="Your name" maxlength="60">
    <textarea id="rvComment" placeholder="Share your experience with this product…" maxlength="1000"></textarea>
    <button class="btn" style="width:100%" onclick="submitReview()">Submit Review</button>
    <div id="reviewMsg" class="review-msg"></div>
  </div>
</div>

</div></div></div></div>`);
  initGallerySwipe();
  loadReviews(id);
  history.pushState({modalOpen:true},"","#product-"+id);
  modalHistoryPushed=true;
}

function starString(rating){
  const r=Math.round(Number(rating||0));
  return "★".repeat(Math.max(0,Math.min(5,r)))+"☆".repeat(5-Math.max(0,Math.min(5,r)));
}

function timeAgo(ts){
  const d=Math.floor((Date.now()-ts)/86400000);
  if(d<=0)return"Today";
  if(d===1)return"1 day ago";
  if(d<30)return`${d} days ago`;
  const mo=Math.floor(d/30);
  return`${mo} month${mo>1?"s":""} ago`;
}

async function loadReviews(productId){
  try{
    const r=await fetch(`/api/products/${encodeURIComponent(productId)}/reviews`);
    const reviews=r.ok?await r.json():[];
    const list=document.getElementById("reviewsList");
    if(!list||currentReviewProductId!==productId)return;
    list.innerHTML=reviews.length
      ?reviews.map(rv=>`<div class="review-item"><div class="review-head"><span class="review-name">${esc(rv.name)}</span><span class="review-date">${timeAgo(rv.createdAt)}</span></div><div class="review-stars">${starString(rv.rating)}</div><div class="review-comment">${esc(rv.comment)}</div></div>`).join("")
      :`<div class="no-reviews">No reviews yet. Be the first to review this product!</div>`;
  }catch(e){
    const list=document.getElementById("reviewsList");
    if(list)list.innerHTML=`<div class="no-reviews">Could not load reviews.</div>`;
  }
}

function setDraftRating(n){
  reviewDraftRating=n;
  document.querySelectorAll("#starPicker span").forEach(el=>el.classList.toggle("active",Number(el.dataset.star)<=n));
}

async function submitReview(){
  const msgEl=document.getElementById("reviewMsg");
  const name=document.getElementById("rvName").value.trim();
  const comment=document.getElementById("rvComment").value.trim();
  msgEl.className="review-msg";
  msgEl.textContent="";

  if(!name){msgEl.className="review-msg err";msgEl.textContent="Please enter your name.";return}
  if(!reviewDraftRating){msgEl.className="review-msg err";msgEl.textContent="Please select a star rating.";return}
  if(!comment){msgEl.className="review-msg err";msgEl.textContent="Please write a short review.";return}

  try{
    const r=await fetch(`/api/products/${encodeURIComponent(currentReviewProductId)}/reviews`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,rating:reviewDraftRating,comment})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Could not submit review");

    // Update the in-memory product + modal summary with the new average.
    const idx=products.findIndex(x=>x.id===currentReviewProductId);
    if(idx!==-1&&d.product){products[idx]=d.product}
    const updated=products[idx];
    if(updated){
      document.getElementById("rsAvg").textContent=updated.rating;
      document.querySelector("#reviewsSection .rating-stars-lg").innerHTML=starString(updated.rating);
      document.getElementById("rsCount").textContent=`${money(updated.reviewCount)} rating${updated.reviewCount===1?"":"s"}`;
    }

    document.getElementById("rvName").value="";
    document.getElementById("rvComment").value="";
    reviewDraftRating=0;
    document.querySelectorAll("#starPicker span").forEach(el=>el.classList.remove("active"));
    msgEl.className="review-msg ok";
    msgEl.textContent="Thanks! Your review has been posted.";
    loadReviews(currentReviewProductId);
  }catch(e){
    msgEl.className="review-msg err";
    msgEl.textContent=e.message||"Could not submit review. Please try again.";
  }
}

// --- Slideable product gallery ---
let galleryIndex=0;
function setGallerySlide(i){
  const track=document.getElementById("galleryTrack");if(!track)return;
  const count=track.children.length;
  galleryIndex=((i%count)+count)%count;
  track.style.transform=`translateX(-${galleryIndex*100}%)`;
  document.querySelectorAll(".gallery-dots .dot").forEach((d,idx)=>d.classList.toggle("active",idx===galleryIndex));
  document.querySelectorAll(".thumbs img").forEach((t,idx)=>t.classList.toggle("active",idx===galleryIndex));
}
function galleryNext(){setGallerySlide(galleryIndex+1)}
function galleryPrev(){setGallerySlide(galleryIndex-1)}
let _galleryMouseUpHandler=null;
function initGallerySwipe(){
  galleryIndex=0;
  const vp=document.getElementById("galleryViewport");if(!vp)return;
  let startX=0,dx=0,dragging=false;
  const onStart=x=>{startX=x;dx=0;dragging=true};
  const onMove=x=>{if(!dragging)return;dx=x-startX};
  const onEnd=()=>{if(!dragging)return;dragging=false;if(Math.abs(dx)>40){dx<0?galleryNext():galleryPrev()}};
  vp.addEventListener("touchstart",e=>onStart(e.touches[0].clientX),{passive:true});
  vp.addEventListener("touchmove",e=>onMove(e.touches[0].clientX),{passive:true});
  vp.addEventListener("touchend",onEnd);
  vp.addEventListener("mousedown",e=>{onStart(e.clientX);e.preventDefault()});
  vp.addEventListener("mousemove",e=>onMove(e.clientX));
  if(_galleryMouseUpHandler)window.removeEventListener("mouseup",_galleryMouseUpHandler);
  _galleryMouseUpHandler=onEnd;
  window.addEventListener("mouseup",_galleryMouseUpHandler);
  vp.tabIndex=0;
  vp.addEventListener("keydown",e=>{if(e.key==="ArrowRight")galleryNext();if(e.key==="ArrowLeft")galleryPrev()});
}
function closeProduct(){
  document.getElementById("overlay")?.remove();
  if(modalHistoryPushed){
    modalHistoryPushed=false;
    if(history.state&&history.state.modalOpen)history.back();
  }
}
window.addEventListener("popstate",function(){
  if(document.getElementById("overlay")){
    document.getElementById("overlay").remove();
  }
  modalHistoryPushed=false;
});
function toggleTheme(){let t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);localStorage.setItem("divykart-theme",t);document.getElementById("themeBtn").textContent=t==="dark"?"☀":"☾"}
(function(){let t=localStorage.getItem("divykart-theme")||"light";document.documentElement.setAttribute("data-theme",t);document.addEventListener("DOMContentLoaded",()=>{let b=document.getElementById("themeBtn");if(b)b.textContent=t==="dark"?"☀":"☾"})})();
setInterval(()=>{
  const slides=document.querySelectorAll(".slide");
  if(!slides.length)return;
  slides.forEach((x,i)=>x.classList.toggle("active",i===slide));
  slide=(slide+1)%slides.length;
},4500)
loadBanners();
loadProducts().catch(e=>document.getElementById("content").innerHTML='<div class="empty"><h2>Could not load products</h2><p>Start the Node.js server and refresh this page.</p></div>');
</script>
